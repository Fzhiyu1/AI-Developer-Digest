version: "3.8"

services:
  daily-paper:
    build: .
    container_name: ai-daily-paper
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./repo-research:/app/repo-research
    restart: unless-stopped
